services:
  db:
    image: mysql:8.0
    container_name: wishlist_db
    restart: always
    environment:
      MYSQL_USER: ${MYSQL_USER:-wishlist_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wishlist_password}
      MYSQL_DATABASE: ${MYSQL_DB:-wishlist_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wishlist_network

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wishlist_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://wishlist_user:wishlist_password@db:3306/wishlist_db}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-mysql+pymysql://wishlist_user:wishlist_password@db:3306/wishlist_db}
      SECRET_KEY: ${SECRET_KEY:-00000000000000000000000000000000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ./backend:/app
    networks:
      - wishlist_network

  frontend:
    build:
      context: ./wishlist-web
      dockerfile: Dockerfile
    container_name: wishlist-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./wishlist-web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      app:
        condition: service_started
    networks:
      - wishlist_network

networks:
  wishlist_network:
    driver: bridge

volumes:
  mysql_data:
